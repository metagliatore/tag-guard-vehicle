title: Vehicle Dashboard
views:
  - title: Vehicle
    path: vehicle
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: Parking Guard Status
            entities:
              - entity: sensor.<your_entry_id>_vehicle_status
                name: Guard Status
              - type: attribute
                entity: sensor.<your_entry_id>_vehicle_status
                attribute: saved_latitude
                name: Saved Latitude
              - type: attribute
                entity: sensor.<your_entry_id>_vehicle_status
                attribute: saved_longitude
                name: Saved Longitude
              - type: attribute
                entity: sensor.<your_entry_id>_vehicle_status
                attribute: stationary_counter
                name: Stationary Counter
              - type: attribute
                entity: sensor.<your_entry_id>_vehicle_status
                attribute: alarm_active
                name: Alarm Active
          - type: markdown
            title: Quick Actions
            content: |
              **Quick Actions**  
              - Save position manually: press button below  
              - Toggle Alarm: press button below  
          - type: horizontal-stack
            cards:
              - type: button
                name: Save Position (Manual)
                tap_action:
                  action: call-service
                  service: tag_guard_vehicle.manual_trigger
                  data: {}
              - type: button
                name: Toggle Alarm
                tap_action:
                  action: call-service
                  service: tag_guard_vehicle.toggle_alarm
                  data: {}
          - type: picture-elements
            image: /local/vehicle_screenshot.svg
            elements:
              - type: state-badge
                entity: sensor.<your_entry_id>_vehicle_status
                style:
                  top: 10%
                  left: 5%
              - type: state-label
                entity: sensor.<your_entry_id>_vehicle_status
                style:
                  top: 12%
                  left: 20%
                  color: white
