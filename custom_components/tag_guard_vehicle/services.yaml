save_position:
  name: Save Position
  description: Force-save the current device_tracker position. By default requires a fresh GPS position (newer than current time). If position is not fresh, starts monitoring until a fresh position is available.
  fields:
    config_entry:
      name: Configuration Entry
      description: Which Tag Guard Vehicle instance to control (leave empty to apply to all instances)
      required: false
      example: "01234567890abcdef"
      selector:
        text:
    require_fresh_position:
      name: Require Fresh Position
      description: If true (default), only save if GPS timestamp is fresh. If false, save immediately regardless of timestamp.
      required: false
      default: true
      selector:
        boolean:
    notify_waiting:
      name: Notify when waiting for GPS
      description: If true, send notification when waiting for a fresh GPS position. Default is false.
      required: false
      default: false
      selector:
        boolean:

manual_trigger:
  name: Manual Trigger
  description: Quick activation of parking monitoring. Saves current device_tracker position and enables the alarm. This is a shortcut alternative to the smart activation modes (connection/position/combined).
  fields:
    config_entry:
      name: Configuration Entry
      description: Which Tag Guard Vehicle instance to control (leave empty to apply to all instances)
      required: false
      example: "01234567890abcdef"
      selector:
        text:

reset_flags:
  name: Reset Flags
  description: Reset notification flags to allow movement notifications again.
  fields:
    config_entry:
      name: Configuration Entry
      description: Which Tag Guard Vehicle instance to control (leave empty to apply to all instances)
      required: false
      example: "01234567890abcdef"
      selector:
        text:

clear_persisted:
  name: Clear Persisted
  description: Clear saved coordinates, reset flags and disable the alarm.
  fields:
    config_entry:
      name: Configuration Entry
      description: Which Tag Guard Vehicle instance to control (leave empty to apply to all instances)
      required: false
      example: "01234567890abcdef"
      selector:
        text:

mute_notifications:
  name: Mute notifications
  description: Silence notifications but keep alarm monitoring active
  fields:
    config_entry:
      name: Configuration Entry
      description: Which Tag Guard Vehicle instance to control (leave empty to apply to all instances)
      required: false
      example: "01234567890abcdef"
      selector:
        text:

unmute_notifications:
  name: Unmute notifications
  description: Re-enable notifications
  fields:
    config_entry:
      name: Configuration Entry
      description: Which Tag Guard Vehicle instance to control (leave empty to apply to all instances)
      required: false
      example: "01234567890abcdef"
      selector:
        text:

start:
  name: Start Guard
  description: Enable the parking guard alarm monitoring
  fields:
    config_entry:
      name: Configuration Entry
      description: Which Tag Guard Vehicle instance to control (leave empty to apply to all instances)
      required: false
      example: "01234567890abcdef"
      selector:
        text:
    notify_waiting:
      name: Notify when waiting for GPS
      description: Send notification if waiting for a fresh GPS position
      required: false
      default: false
      selector:
        boolean:

