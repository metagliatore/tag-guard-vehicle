name: Translation Validator

on:
  push:
    paths:
      - 'custom_components/tag_guard_vehicle/translations/**'
      - 'tests/test_translation_format.py'
      - 'tests/test_translations.py'
  pull_request:
    paths:
      - 'custom_components/tag_guard_vehicle/translations/**'
      - 'tests/test_translation_format.py'
      - 'tests/test_translations.py'

jobs:
  translations:
    name: Run translation validators
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi
      - name: Run translation tests
        run: |
          pytest -q tests/test_translation_format.py tests/test_translations.py
